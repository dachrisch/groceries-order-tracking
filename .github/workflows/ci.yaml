# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 🏗️🧪🚀 Build, Test and Deploy everything

on:
  push:
    tags:
      - "*"
  schedule:
    # Weekly rebuild: re-resolve the base image and replay apt/node installs so OS
    # patch releases land even when the app has no code change.
    - cron: '0 4 * * 1'

permissions:
  contents: write
  checks: write
  security-events: write

concurrency:
  group: build-test-deploy
  cancel-in-progress: true


jobs:
  node-project:
    uses: ./.github/workflows/part_node_build.yaml
    secrets: inherit
    with:
      project: .

  docker-image:
    uses: ./.github/workflows/part_docker_build.yaml
    with:
      dockerfile: Dockerfile
      image_name: groceries-order-tracking
      version: "${{ github.ref_name }}"

  image-test:
    needs:
      - node-project
      - docker-image
    uses: ./.github/workflows/part_docker_test.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: groceries-order-tracking

  image-push:
    needs:
      - docker-image
      - image-test
    secrets: inherit
    uses: ./.github/workflows/part_docker_push_artifact.yaml
    with:
      artifact_name: ${{ needs.docker-image.outputs.artifact_name }}
      image_name: dachrisch/groceries-order-tracking
      local_image_name: groceries-order-tracking
      version: "${{ github.ref_name }}"
